{% extends 'adminpanel/index.html' %}
{% load static %}

{% block admin_content %}

<link rel="stylesheet" href="{% static 'adminpanel/css/products.css' %}">

<div class="container-fluid py-4">

    <div class="card shadow border-0 rounded-4">

        <div class="card-header bg-primary text-white">

            <h3 class="mb-0">
                Edit Category
            </h3>

        </div>

        <div class="card-body">

            <form method="POST" enctype="multipart/form-data">

                {% csrf_token %}

                <!-- Category Name -->
                <div class="mb-3">

                    <label class="form-label fw-bold">
                        Category Name
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        name="name"
                        value="{{ category.name }}"
                        required>

                </div>


                <!-- Main Category -->
                <div class="mb-3">

                    <label class="form-label fw-bold">
                        Main Category
                    </label>

                    <select
                        name="parent"
                        class="form-select">

                        <option value="">
                            -- Main Category --
                        </option>

                        {% for c in categories %}

                            <option
                                value="{{ c.id }}"
                                {% if category.parent_id == c.id %}
                                    selected
                                {% endif %}>

                                {{ c.name }}

                            </option>

                        {% endfor %}

                    </select>

                    <small class="text-muted">
                        Example: Women, Men, Beauty
                    </small>

                </div>


                <!-- Current Image -->
                <div class="mb-3">

                    <label class="form-label fw-bold">
                        Current Image
                    </label>

                    <br>

                    {% if category.image %}

                        <img
                            src="{{ category.image.url }}"
                            width="120"
                            class="mb-3 rounded">

                    {% endif %}

                    <input
                        type="file"
                        name="image"
                        class="form-control">

                </div>


                <!-- Buttons -->
                <button
                    type="submit"
                    class="btn btn-primary">

                    Update Category

                </button>

                <a
                    href="{% url 'admin_categories' %}"
                    class="btn btn-secondary">

                    Back

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
