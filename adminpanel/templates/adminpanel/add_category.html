{% extends 'adminpanel/index.html' %}
{% load static %}

{% block admin_content %}

<link rel="stylesheet" href="{% static 'adminpanel/css/products.css' %}">

<div class="container-fluid py-4">

    <div class="card add-card">

        <div class="card-header">
            <h3 class="mb-0">
                <i class="fa-solid fa-folder-plus me-2"></i>
                Add Category
            </h3>
        </div>

        <div class="card-body p-4">

            <form method="POST" enctype="multipart/form-data">

                {% csrf_token %}

                <div class="mb-4">

                    <label class="form-label">
                        Category Name
                    </label>

                    <input
                        type="text"
                        name="name"
                        class="form-control"
                        placeholder="Enter category name"
                        required>

                </div>

                <div class="mb-4">

                    <label class="form-label">
                        Category Image
                    </label>

                    <input
                        type="file"
                        name="image"
                        class="form-control">

                </div>
                <div class="mb-4">

                    <label class="form-label">
                        Parent Category
                    </label>
                
                    <select name="parent" class="form-select">
                
                        <option value="">Main Category</option>
                
                        {% for category in categories %}
                
                            <option value="{{ category.id }}">
                                {{ category.name }}
                            </option>
                
                        {% endfor %}
                
                    </select>
                
                    <small class="text-muted">
                        Select a parent category for creating a subcategory.
                    </small>
                
                </div>
                <div class="d-flex gap-3">

                    <button type="submit" class="btn save-btn">
                        <i class="fa-solid fa-floppy-disk me-2"></i>
                        Save Category
                    </button>

                    <a href="{% url 'admin_categories' %}" class="btn back-btn">
                        <i class="fa-solid fa-arrow-left me-2"></i>
                        Back
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
